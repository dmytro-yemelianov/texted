[workspace]
members = [
    "crates/texted-kernel",
    "crates/texted-buffer",
    "crates/texted-layout",
    "crates/texted-io",
    "crates/texted-app",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Dmytro Yemelianov"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
crossbeam-channel = "0.5"
