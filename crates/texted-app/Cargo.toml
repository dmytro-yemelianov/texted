[package]
name = "texted-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "texted"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
texted-kernel = { path = "../texted-kernel" }
texted-buffer = { path = "../texted-buffer" }
texted-layout = { path = "../texted-layout" }
texted-io = { path = "../texted-io" }
winit = "0.29"
softbuffer = "0.4"
font8x8 = "0.3"
ab_glyph = "0.2"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
