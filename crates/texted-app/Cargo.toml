[package]
name = "texted-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "texted"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texted-kernel = { path = "../texted-kernel" }
crossbeam-channel.workspace = true
texted-buffer = { path = "../texted-buffer" }
texted-layout = { path = "../texted-layout" }
texted-io = { path = "../texted-io" }
winit = "0.29"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17.2", default-features = false }
objc2 = "0.6"
