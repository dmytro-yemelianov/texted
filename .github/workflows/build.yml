name: Build and deliver

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust regression tests
        run: cargo test --locked --workspace
      - name: Font asset and packaging regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and smoke-test native executable
        run: |
          cargo build --locked --release --bin texted --bin texted-tui
          ./target/release/texted --version
          ./target/release/texted --help
          ./target/release/texted-tui --version
          ./target/release/texted --dump-grid 80x24 README.md > target/cell-grid.json
          python3 scripts/smoke_terminal.py --binary target/release/texted-tui

  package:
    name: Universal macOS delivery
    needs: checks
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust and both macOS targets
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-apple-darwin x86_64-apple-darwin
      - name: Build, package and verify
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/package_macos.py --version-tag "$RELEASE_TAG"
          else
            python3 scripts/package_macos.py
          fi
      - name: Verify delivery checksums
        working-directory: dist
        run: shasum -a 256 -c ./*.sha256
      - name: Upload ZIP, DMG, manifest and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Texted-macOS-universal
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.json
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Deliver tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Texted-macOS-universal
          path: dist
      - name: Verify downloaded artifacts
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Texted $RELEASE_TAG" "${flags[@]}"
          fi
